                        <div class="item"><span>血氧</span>    <span class="v ok"   id="anom-spo2">正常</span></div>
                        <div class="item"><span>HRV</span>     <span class="v ok"   id="anom-hrv">正常</span></div>
                    </div>
                    <div class="anomaly-advice" id="anom-advice">建议：正视屏幕，放松面部</div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- 隐藏 canvas：抓取视频帧上传 -->
<canvas id="frame-canvas" width="275" height="366" style="display:none;"></canvas>

<script>
    const config = {
        targetFPS: 15,
        canvasWidth: 275,
        canvasHeight: 366,
        jpegQuality: 0.7,
        heartRateInterval: 2000,
        // [2026-08-09 刷新率提速] 原 1500ms 是在后端 OpenFace 原生GPU推理服务
        // (openface_service.py) 因误用 werkzeug 开发服务器（每请求开新线程导致
        // cuDNN 算法自动调优缓存反复失效）实测单帧耗时 2.4~4.8s 时代留下的保守值。
        // 根因修复后（该服务已改为 waitress + threads=1 常驻单线程），实测单帧
        // infer_cost 稳定在 60~100ms，故将轮询间隔从 1500ms 降到 500ms，配合
        // test2.py 里 openface_next_time 节流值同步从 0.8s 降到 0.5s。
        openfaceInterval: 500,
        // 心率/血氧/呼吸率：采样窗口时长（毫秒），窗口内持续跳动显示，窗口结束后取均值并冻结
        // [2026-08-08 采样窗口延长] 用户需求: "把30秒计算数值延长到60秒计算，这样延长采集
        // 时间后数值会比较准确"。由30000ms延长为60000ms。同时，窗口起点不再是"页面加载/
        // 监测启动时刻"，而是改为"该指标第一次成功返回有效值的时刻"（见下方 hrState/
        // spo2State/respState 的 lazy-start 实现），避免因人脸检测/模型预热耗时挤占采样时长。
        vitalsSampleWindow: 60000,
        spo2Min: 95,
        spo2Max: 99
    };

    const el = {
        video: document.getElementById("webcam"),
        canvas: document.getElementById("frame-canvas"),

        // 保留原有 ID（不变，后端不用改）
        heartRateDisplay: document.getElementById("heart-rate"),
        hrStatus: document.getElementById("hr-status"),
        hrDot: document.getElementById("hr-dot"),
        hrRange: document.getElementById("hr-range"),
        spo2Display: document.getElementById("spo2"),
        spo2Status: document.getElementById("spo2-status"),
        spo2Dot: document.getElementById("spo2-dot"),
        spo2Range: document.getElementById("spo2-range"),
        placeholderA: document.getElementById("placeholder-a"),
        placeholderB: document.getElementById("placeholder-b"),
        ofStatus: document.getElementById("of-status"),
        ofMessage: document.getElementById("of-message"),
        ofFaceCount: document.getElementById("of-face-count"),
        ofEmotion: document.getElementById("of-emotion"),
        ofGaze: document.getElementById("of-gaze"),
        ofAu: document.getElementById("of-au"),

        // 顶栏
        topTimer: document.getElementById("top-timer"),
        topFps: document.getElementById("top-fps"),
        topDemoTag: document.getElementById("top-demo-tag"),
        auTag: document.getElementById("au-tag"),

        // 情绪扩展
        emoIcon: document.getElementById("emo-icon"),
        emoProb: document.getElementById("emo-prob"),
        emoTagBadge: document.getElementById("emo-tag-badge"),
        emoMeta: document.getElementById("emo-meta"),
        psyRelax: document.getElementById("psy-relax"),
        psyHesitate: document.getElementById("psy-hesitate"),
        psyNervous: document.getElementById("psy-nervous"),

        // [新增功能-呼吸率](2026-08-08) 已接入后端真实计算(/get_hr的respiration_rate字段)，
        // 采样/冻结逻辑与心率一致。血压/HRV仍暂未授权计算，固定锁定态。
        respRate: document.getElementById("resp-rate"),
        respStatus: document.getElementById("resp-status"),
        respDot: document.getElementById("resp-dot"),
        respRange: document.getElementById("resp-range"),
        hrvSdnn: document.getElementById("hrv-sdnn"),

        // 头姿+视线+注意力
        ofGazeState: document.getElementById("of-gaze-state"),
        gazeDot: document.getElementById("gaze-dot"),
        poseYaw: document.getElementById("pose-yaw"),
        posePitch: document.getElementById("pose-pitch"),
        poseRoll: document.getElementById("pose-roll"),
        poseDev: document.getElementById("pose-dev"),
        attScore: document.getElementById("att-score"),
        attBadge: document.getElementById("att-badge"),
        blinkRate: document.getElementById("blink-rate"),
        perclos: document.getElementById("perclos"),
        gazeStab: document.getElementById("gaze-stab"),
        earLr: document.getElementById("ear-lr"),
        fatigue: document.getElementById("fatigue"),

        // 异常
        anomIndicator: document.getElementById("anom-indicator"),
        anomLevel: document.getElementById("anom-level"),
        anomGaze: document.getElementById("anom-gaze"),
        anomBlink: document.getElementById("anom-blink"),
        anomBrow: document.getElementById("anom-brow"),
        anomAdvice: document.getElementById("anom-advice"),

        // AU 详情
        auDominant: document.getElementById("au-dominant"),
        auSym: document.getElementById("au-sym"),
        auActivity: document.getElementById("au-activity"),

        // HUD
        hudConf: document.getElementById("hud-conf"),
        hudFace: document.getElementById("hud-face"),
        hudFaceDot: document.getElementById("hud-face-dot"),
        hudLatency: document.getElementById("hud-latency")
    };

    const ctx = el.canvas.getContext("2d");
    const state = { videoReady: false, lastFrameTime: 0, startTime: Date.now() };
    // [2026-08-09] 记录每个 AU 横条上一次渲染的真实数值，用于判断"这一帧数值是否
    // 真的变化了"，从而决定是否触发一次伸缩/发光脉冲动画（见 renderOpenFace 内的
    // setAuBar 函数）。
    const auLastValues = {};

    // [2026-08-09 生硬感修复] 统一的"数值平滑动画"引擎。
    // 背景：AU 横条 / 头姿罗盘圆点的原始数据都是每 1.5s 才从 /get_openface 轮询
    // 一次，之前依赖 CSS transition 在"数据到达那一刻"做一次性过渡，视觉上是
    // "长时间静止 -> 突然快速变化 -> 再静止"的生硬节奏（用户反馈"面部表情过渡
    // 太快、头部视线过渡生硬且慢"正是这个问题）。
    // 解法：用 requestAnimationFrame 起一个常驻的插值(lerp)循环，每个需要平滑的
    // 数值都注册一个 {current, target} 对；每一帧里 current 都朝 target 挪一点
    // （挪动比例由 smoothingFactor 控制），不管后端多久才更新一次目标值，画面上
    // 呈现的都是连续、匀速感的运动，而不是"停顿-猛冲"。
    const smoothTargets = {};   // key -> { current, target, apply(current) }
    // 数值型（AU横条宽度）用稍慢的平滑系数，视觉上更像"渐变呼吸"；
    // 位置型（头姿圆点像素坐标）用稍快的系数，避免追踪感太迟滞。
    const SMOOTH_FACTOR_VALUE = 0.12;
    const SMOOTH_FACTOR_POSITION = 0.18;
    function registerSmoothTarget(key, initialValue, applyFn, factor) {
        if (!smoothTargets[key]) {
            smoothTargets[key] = { current: initialValue, target: initialValue, apply: applyFn, factor };
        }
        return smoothTargets[key];
    }
    function setSmoothTarget(key, newTarget) {
        const t = smoothTargets[key];
        if (t) t.target = newTarget;
    }
    function smoothAnimLoop() {
        for (const key in smoothTargets) {
            const t = smoothTargets[key];
            const diff = t.target - t.current;
            if (Math.abs(diff) < 0.0008) {
                t.current = t.target;
            } else {
                t.current += diff * t.factor;
            }
            t.apply(t.current);
        }
        requestAnimationFrame(smoothAnimLoop);
    }
    requestAnimationFrame(smoothAnimLoop);

    // 头姿罗盘圆点：x/y 各自独立插值，但要合并写进同一个 transform，
    // 所以用一个小 helper 在每次任一坐标更新后重新拼一次完整的 translate()。
    function applyGazeDotTransform() {
        const gx = smoothTargets.gazeDotX ? smoothTargets.gazeDotX.current : 0;
        const gy = smoothTargets.gazeDotY ? smoothTargets.gazeDotY.current : 0;
        if (el.gazeDot) {
            el.gazeDot.style.transform = `translate(calc(-50% + ${gx.toFixed(2)}px), calc(-50% + ${gy.toFixed(2)}px))`;
        }
    }
    registerSmoothTarget("gazeDotX", 0, applyGazeDotTransform, SMOOTH_FACTOR_POSITION);
    registerSmoothTarget("gazeDotY", 0, applyGazeDotTransform, SMOOTH_FACTOR_POSITION);

    function safeText(v, fb = "--") {
        if (v === null || v === undefined || v === "") return fb;
        if (typeof v === "object") return JSON.stringify(v);
        return String(v);
    }

    // ========== 摄像头初始化 ==========
    async function setupWebcam() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { width: { ideal: config.canvasWidth },
                         height: { ideal: config.canvasHeight },
                         facingMode: "user" },
                audio: false
            });
            el.video.srcObject = stream;
            return new Promise(resolve => {
                el.video.addEventListener("canplay", () => {
                    state.videoReady = true;
                    startFrameLoop();
                    resolve();
                }, { once: true });
            });
        } catch (err) {
            console.error("摄像头初始化失败:", err);
            alert("摄像头初始化失败");
            throw err;
        }
    }

    async function processAndUploadFrame() {
        // [2026-08-09 稳定性修复] drawImage 之前是裸调用、不在 try/catch 保护范围内：
        // 浏览器标签页切到后台/视频流被浏览器暂停/<video> readyState 变化时，
        // drawImage 可能同步抛出异常（如 InvalidStateError），且这个异常发生在
        // async 函数体内、没有被 catch。现整体纳入 try/catch，任何一步失败都
        // 不影响循环继续跑下去。
        try {
            ctx.drawImage(el.video, 0, 0, el.canvas.width, el.canvas.height);
            const blob = await new Promise(r => el.canvas.toBlob(r, "image/jpeg", config.jpegQuality));
            if (!blob) return;
            await fetch("/upload_frame", {
                method: "POST",
                body: blob,
                headers: {
                    "Content-Type": "image/jpeg",
                    // [2026-08-11 流水线上传] 客户端单调毫秒时间戳。后端用它丢弃
                    // 乱序迟到的旧帧(并发在途时后发的请求可能先到)。
                    "X-Frame-Ts": String(performance.timeOrigin + performance.now())
                },
                // 单帧上传超时保护：网络抖动时不让一个卡死的请求长期占用在途名额
                signal: AbortSignal.timeout ? AbortSignal.timeout(4000) : undefined
            });
        } catch (e) { console.error("上传视频帧失败:", e); }
    }

    // [2026-08-09 二次修复-根本原因] 之前用 requestAnimationFrame 驱动抓帧循环，
    // 表面上看起来"只要 try/catch 包住任何异常就不会断"，但实测发现真正的断裂
    // 原因不是异常，而是浏览器规范本身：当标签页切到后台/最小化/失去焦点时，
    // 浏览器会直接停止调度 requestAnimationFrame 的回调（不是降频，是完全不调用），
    // 一直要等标签页重新回到前台才会恢复——这期间没有任何 JS 异常，try/catch 根本
    // 拦不到，因为回调压根没被执行。而 setInterval 只会被节流（通常钳到>=1s一次），
    // 不会被完全冻结，这就是为什么/get_openface轮询"看起来一直在正常返回"，但AU
    // 面板数值/条形图在后台期间完全不变——因为上传摄像头帧的循环停摆了，后端拿到
    // 的一直是同一帧推理结果。用户上传的录屏视频里全程冻结正是这个问题的实际复现。
    // 修复：改用 setInterval 驱动抓帧循环。setInterval 在后台标签页只会被节流，
    // 不会完全停止，配合后端 /upload_frame 里本来就有的 0.8s OpenFace 推理节流，
    // 完全不需要 rAF 的精确帧同步，用 setInterval 更适合这种"周期性后台上传"场景。
    //
    // [2026-08-09 三次修复-页面卡顿根因] 上面用 setInterval(fn, 66ms) 驱动抓帧
    // （targetFPS=15 => 每66ms一次），但 processAndUploadFrame() 内部是"画布绘制+
    // JPEG编码+网络上传"的 async 操作，实测端到端平均耗时 226ms（网络稍差时可达
    // 1s+），远超 66ms 的间隔。setInterval 完全不会等上一次 async 任务跑完，导致
    // 还没收到上一次 /upload_frame 响应，下一次、下下次……请求就已经被陆续触发，
    // 多个"画布编码+网络请求"同时在浏览器主线程和网络上堆积、竞争资源——这才是
    // 用户反馈"页面运行卡"的真正原因，而不是简单的资源消耗问题。
    // 修复：加一个 inFlight 忙碌标记，上一帧还没处理完时，本次 tick 直接跳过，
    // 绝不并发触发第二个抓帧+上传任务，从根本上消除请求堆积。
    // [2026-08-11 四次修复-吞吐流水线] 上面的 inFlight 单飞标记解决了"无限堆积"，
    // 但把上传变成了严格串行：下一帧必须等上一帧的完整 HTTP 往返(公网实测
    // 端到端 ~170ms+，DevTools Timing: queueing+waiting 57ms+download 110ms)
    // 结束后才发出。串行模式下帧率被钳死在 1000/RTT ≈ 5~6fps，与后端日志
    // effective_fs≈8.5 完全吻合——这才是"整体仍然不流畅"的根因：不是单个请求慢，
    // 而是请求之间被人为串行化，网络延迟直接变成了帧间隔。
    // 修复：改为"有限流水线"——允许最多 MAX_IN_FLIGHT 个请求同时在途
    // (浏览器对同源 HTTPS 有 6 条并发连接，3 个在途远在安全线内)，
    // 达到上限才跳帧。吞吐从 1/RTT 提升到 MAX_IN_FLIGHT/RTT，
    // 公网 170ms RTT 下可支撑 ~17fps，足够跑满 targetFPS=15。
    // 后端配套：/upload_frame 按 X-Frame-Ts 丢弃乱序旧帧，保证
    // rPPG 缓冲区时间序单调，不会因并发在途导致信号倒流。
    const MAX_IN_FLIGHT = 3;
    let frameLoopTimer = null;
    let frameLoopInFlight = 0;
    async function processFrameLoopTick() {
        if (frameLoopInFlight >= MAX_IN_FLIGHT) return;  // 在途已满，本次跳过，避免无限堆积
        if (!state.videoReady) return;
        frameLoopInFlight++;
        try {
            await processAndUploadFrame();
        } catch (e) {
            console.error("processFrameLoopTick 异常(已忽略，继续下一次):", e);
        } finally {
            frameLoopInFlight--;
        }
    }
    function startFrameLoop() {
        if (frameLoopTimer) return;
        frameLoopTimer = setInterval(processFrameLoopTick, Math.round(1000 / config.targetFPS));
    }
    // 标签页从后台切回前台时立即补一帧，避免长时间停留后仍要等一个完整周期才刷新
    document.addEventListener("visibilitychange", () => {
        if (!document.hidden && state.videoReady) {
            processFrameLoopTick();
        }
    });

    // ========== 顶栏计时 & FPS ==========
    function updateTopBar() {
        const sec = Math.floor((Date.now() - state.startTime) / 1000);
        const mm = String(Math.floor(sec/60)).padStart(2,'0');
        const ss = String(sec%60).padStart(2,'0');
        el.topTimer.textContent = `${mm}:${ss}`;
    }
    setInterval(updateTopBar, 1000);

    // ========== 心率 & 血氧 & 呼吸率 ==========
    // 心率/呼吸率：来自后端 /get_hr 实时值，持续跳动 60s 后取窗口内平均值并冻结显示
    // 血氧：后端暂无算法，前端在 95~99 间生成随机数模拟跳动，60s 后取平均值并冻结
    // [2026-08-08 采样起点改为"首次返回值时刻"] 用户需求: "计算时间从第一次返回数值开始计算"。
    // 三个指标各自独立：started=false 且 startTs=null 表示该指标尚未收到第一个有效值，
    // 此时不计时、不判定是否到期；一旦该指标收到第一个有效值(HR/呼吸率来自后端真实返回，
    // 血氧来自前端首次模拟采样)，立即记录 startTs=当前时间 并置 started=true，
    // 此后才开始按 config.vitalsSampleWindow(60000ms) 计时。
    function startHeartRateMonitoring() {
        const hrState   = { samples: [], started: false, startTs: null, frozen: false, frozenVal: null };
        const spo2State = { samples: [], started: false, startTs: null, frozen: false, frozenVal: null };
        // [新增功能-呼吸率] 独立采样状态，与心率/血氧互不影响
        const respState = { samples: [], started: false, startTs: null, frozen: false, frozenVal: null };

        function setSamplingUI(dotEl, statusEl, rangeEl, rangeBase, sampling) {
            if (dotEl) dotEl.classList.toggle("sampling", sampling);
            if (statusEl) statusEl.classList.toggle("sampling", sampling);
            if (rangeEl) rangeEl.textContent = sampling ? `${rangeBase} · 采样中` : rangeBase;
        }

        function judgeHrStatus(hr) {
            if (hr === null || Number.isNaN(hr)) return "--";
            return (hr >= 60 && hr <= 100) ? "正常" : (hr < 60 ? "偏低" : "偏高");
        }
        function judgeSpo2Status(spo2) {
            if (spo2 === null || Number.isNaN(spo2)) return "--";
            return (spo2 >= 95) ? "正常" : "偏低";
        }
        // [新增功能-呼吸率] 正常成人静息呼吸范围参考 12~20 次/分
        function judgeRespStatus(resp) {
            if (resp === null || Number.isNaN(resp)) return "--";
            return (resp >= 12 && resp <= 20) ? "正常" : (resp < 12 ? "偏低" : "偏高");
        }

        function finalizeIfDue(nowTs) {
            // 注意：三个指标的 startTs 各自独立（取决于各自"第一次返回有效值"的时刻），
            // 因此必须分别计算 elapsed，不能再共用同一个 elapsed 变量。
            // 若该指标尚未 started（还没收到第一个有效值），startTs 为 null，直接跳过判定。
            if (!hrState.frozen && hrState.started) {
                const hrElapsed = nowTs - hrState.startTs;
                if (hrElapsed >= config.vitalsSampleWindow) {
                    if (hrState.samples.length > 0) {
                        const avg = hrState.samples.reduce((a,b)=>a+b,0) / hrState.samples.length;
                        hrState.frozenVal = Math.round(avg);
                    } else {
                        hrState.frozenVal = null;
                    }
                    hrState.frozen = true;
                    el.heartRateDisplay.textContent = hrState.frozenVal !== null ? hrState.frozenVal : "— —";
                    el.hrStatus.textContent = judgeHrStatus(hrState.frozenVal);
                    setSamplingUI(el.hrDot, el.hrStatus, el.hrRange, "60 ~ 100", false);
                }
            }
            if (!spo2State.frozen && spo2State.started) {
                const spo2Elapsed = nowTs - spo2State.startTs;
                if (spo2Elapsed >= config.vitalsSampleWindow) {
                    if (spo2State.samples.length > 0) {
                        const avg = spo2State.samples.reduce((a,b)=>a+b,0) / spo2State.samples.length;
                        spo2State.frozenVal = Math.round(avg);
                    } else {
                        spo2State.frozenVal = null;
                    }
                    spo2State.frozen = true;
                    el.spo2Display.textContent = spo2State.frozenVal !== null ? spo2State.frozenVal : "— —";
                    el.spo2Status.textContent = judgeSpo2Status(spo2State.frozenVal);
                    setSamplingUI(el.spo2Dot, el.spo2Status, el.spo2Range, "≥ 95", false);
                }
            }
            // [新增功能-呼吸率] 采样窗口结束后取均值并冻结，与心率/血氧使用同一套逻辑
            if (!respState.frozen && respState.started) {
                const respElapsed = nowTs - respState.startTs;
                if (respElapsed >= config.vitalsSampleWindow) {
                    if (respState.samples.length > 0) {
                        const avg = respState.samples.reduce((a,b)=>a+b,0) / respState.samples.length;
                        respState.frozenVal = Math.round(avg * 10) / 10;
                    } else {
                        respState.frozenVal = null;
                    }
                    respState.frozen = true;
                    el.respRate.textContent = respState.frozenVal !== null ? respState.frozenVal : "— —";
                    if (el.respStatus) el.respStatus.textContent = judgeRespStatus(respState.frozenVal);
                    setSamplingUI(el.respDot, el.respStatus, el.respRange, "12 ~ 20", false);
                }
            }
        }

        // [2026-08-09 性能优化] 同样加 inFlight 防护，避免与抓帧上传循环、OpenFace
        // 轮询循环同时出现"上一次请求还没返回、下一次又发出去"的堆积现象。
        let hrTickInFlight = false;
        async function tick() {
            if (hrTickInFlight) return;
            hrTickInFlight = true;
            const now = Date.now();

            // ---- 心率：读取后端真实数据 ----
            try {
                const r = await fetch("/get_hr", { cache: "no-store" });
                if (!r.ok) throw new Error("HTTP " + r.status);
                const d = await r.json();
                if (d && d.heart_rate !== undefined && d.heart_rate !== null && d.heart_rate !== "") {
                    const hr = Number(d.heart_rate);
                    if (!Number.isNaN(hr) && hr > 0) {
                        if (!hrState.frozen) {
                            // [采样起点=首次返回值] 该指标收到的第一个有效值：记录起点并开始计时
                            if (!hrState.started) {
                                hrState.started = true;
                                hrState.startTs = now;
                            }
                            hrState.samples.push(hr);
                            el.heartRateDisplay.textContent = hr.toFixed(1);
                            el.hrStatus.textContent = judgeHrStatus(hr);
                        }
                    } else if (!hrState.frozen) {
                        el.heartRateDisplay.textContent = "— —";
                    }
                } else if (!hrState.frozen) {
                    el.heartRateDisplay.textContent = "— —";
                }

                // ---- 呼吸率：同一个/get_hr响应里的respiration_rate字段，独立处理 ----
                if (d && d.respiration_rate !== undefined && d.respiration_rate !== null && d.respiration_rate !== "") {
                    const resp = Number(d.respiration_rate);
                    if (!Number.isNaN(resp) && resp > 0) {
                        if (!respState.frozen) {
                            // [采样起点=首次返回值] 呼吸率独立判定"第一次返回值"，与心率互不影响
                            if (!respState.started) {
                                respState.started = true;
                                respState.startTs = now;
                            }
                            respState.samples.push(resp);
                            el.respRate.textContent = resp.toFixed(1);
                            if (el.respStatus) el.respStatus.textContent = judgeRespStatus(resp);
                        }
                    } else if (!respState.frozen) {
                        el.respRate.textContent = "— —";
                    }
                } else if (!respState.frozen) {
                    el.respRate.textContent = "— —";
                }
            } catch (e) {
                console.error("心率获取失败:", e);
                if (!hrState.frozen) el.heartRateDisplay.textContent = "— —";
                if (!respState.frozen) el.respRate.textContent = "— —";
            }

            // ---- 血氧：前端模拟 95~99 随机数，直到冻结 ----
            // 说明：血氧当前无后端真实算法，为与心率/呼吸率的"从第一次返回值开始计算"语义保持
            // 一致的用户体验，将"第一次生成模拟采样值"的时刻视为该指标的起点。
            if (!spo2State.frozen) {
                if (!spo2State.started) {
                    spo2State.started = true;
                    spo2State.startTs = now;
                }
                const spo2Sim = Math.floor(Math.random() * (config.spo2Max - config.spo2Min + 1)) + config.spo2Min;
                spo2State.samples.push(spo2Sim);
                el.spo2Display.textContent = spo2Sim;
                el.spo2Status.textContent = judgeSpo2Status(spo2Sim);
            }

            // ---- 血压 / HRV：暂无授权算法，固定提示。呼吸率已接入真实计算(见上方tick逻辑) ----
            if (el.placeholderB) el.placeholderB.textContent = "--";
            if (el.hrvSdnn) el.hrvSdnn.textContent = "--";

            finalizeIfDue(now);
            hrTickInFlight = false;
        }

        // 初始状态：三个卡片进入"采样中"视觉态
        setSamplingUI(el.hrDot, el.hrStatus, el.hrRange, "60 ~ 100", true);
        setSamplingUI(el.spo2Dot, el.spo2Status, el.spo2Range, "≥ 95", true);
        setSamplingUI(el.respDot, el.respStatus, el.respRange, "12 ~ 20", true);

        tick();
        setInterval(tick, config.heartRateInterval);
    }

    // ========== OpenFace 渲染 (保留原有链路 + 兼容扩展字段) ==========
    // [2026-08-09 中文化修复] 后端 status 字段本身是英文枚举值（ok/no_face/error/idle），
    // 之前直接 textContent = data.status 会把这几个英文单词原样显示在"OpenFace 状态"
    // 徽章上——用户要求"结果要用中文显示"，这里做一次映射，未识别的枚举值原样兜底显示。
    const STATUS_CN = { ok: "正常", no_face: "未检测到人脸", error: "错误", idle: "待命" };
    function renderOpenFace(data) {
        el.ofStatus.textContent      = safeText(STATUS_CN[data.status] ?? data.status);
        el.ofMessage.textContent     = safeText(data.message ?? data.hint);
        // [2026-08-09 文案优化] 用户反馈"人脸数量"这个字段实际上只是 0/1
        // 布尔值（后端 native_inference.py 只取置信度最高的一张脸，不是真正
        // 的多人脸计数——见 openface_parser.py 的 face_count = 1 if det else 0），
        // 显示成数字"1"容易让人误以为在统计人脸个数。改为"人脸检测"标签 +
        // "已检测到人脸/未检测到人脸"文字，准确反映这个字段的真实语义。
        const faceCount = data.face_count ?? data.faces_detected
                       ?? (Array.isArray(data.faces) ? data.faces.length : undefined);
        el.ofFaceCount.textContent = (faceCount === undefined || faceCount === null)
            ? "--"
            : (Number(faceCount) > 0 ? "已检测到人脸" : "未检测到人脸");

        // ---- 情绪 ----
        const emo = data.emotion ?? data.top_emotion ?? data.expression ?? "--";
        el.ofEmotion.textContent = safeText(emo);
        if (data.emo_prob !== undefined)      el.emoProb.textContent = (Number(data.emo_prob)*100).toFixed(0) + "%";
        if (data.emo_icon)                    el.emoIcon.textContent = data.emo_icon;
        // [2026-08-09 情绪统计平滑] emo_stability/emo_switches 现在由后端
        // metrics_aggregator.py 基于"统计平滑后的稳定主导情绪"计算，不再是单帧
        // 噪声抖动的次数，数值本身已经是"准确结果"；这里额外把 emo_dominant_
        // duration_sec（当前情绪状态已持续多久）也显示出来，让用户更直观地感受到
        // "这个判断是稳定累积出来的，不是刚刚一帧跳出来的"。
        if (data.emo_stability !== undefined) {
            const durTxt = (data.emo_dominant_duration_sec !== undefined && data.emo_dominant_duration_sec !== null)
                ? `${data.emo_dominant_duration_sec.toFixed(0)}s` : "--";
            el.emoMeta.textContent = `持续 ${durTxt}  ·  60s 稳定度 ${(data.emo_stability*100).toFixed(0)}%  ·  切换 ${data.emo_switches ?? '--'} 次`;
        }
        if (data.psycho) {
            el.psyRelax.textContent    = safeText(data.psycho.relax);
            el.psyHesitate.textContent = safeText(data.psycho.hesitate);
            el.psyNervous.textContent  = safeText(data.psycho.nervous);
        }
        // ---- 情绪 8 类分布横条 ----
        // [2026-08-09 情绪分布重构] 后端 flask_openface_patch.py 新增的 emo_distribution
        // 字段是一个长度为 8 的数组，每项 {label, label_cn, icon, prob}，顺序固定
        // (AffectNet-8: neutral/happy/sad/surprise/fear/disgust/angry/contempt)，
        // 与 HTML 里 8 个 .emo-row 的 data-emo 一一对应。这里复用 setAuBar 同款的
        // smoothAnimLoop 插值 + au-pulse 脉冲动画方案，但情绪概率本身就是 0~1 且
        // 求和=1，不需要像 AU 那样做 sqrt 放大/自定义 cap，直接线性映射长度即可，
        // 所以单独写一个 setEmoBar，不复用 AU_DISPLAY_MAX 那套逻辑。
        if (Array.isArray(data.emo_distribution)) {
            data.emo_distribution.forEach(item => {
                const key = item.label;
                if (!key) return;
                const barEl = document.getElementById(`emo-bar-${key}`);
                const valEl = document.getElementById(`emo-val-${key}`);
                if (!barEl || !valEl) return;
                const v = Number(item.prob) || 0;
                const scale = Math.max(0, Math.min(1, v));
                const smoothKey = `emo-bar-${key}`;
                registerSmoothTarget(smoothKey, scale, (cur) => {
                    barEl.style.transform = `scaleX(${cur.toFixed(4)})`;
                }, SMOOTH_FACTOR_VALUE);
                setSmoothTarget(smoothKey, scale);
                valEl.textContent = (v * 100).toFixed(0) + "%";
                const prev = auLastValues[smoothKey];
                if (prev === undefined || Math.abs(prev - v) > 0.005) {
                    barEl.classList.remove("au-pulse");
                    requestAnimationFrame(() => barEl.classList.add("au-pulse"));
                }
                auLastValues[smoothKey] = v;
            });
        }

        // ---- 视线 ----
        el.ofGaze.textContent = safeText(data.gaze_text ?? data.gaze);
        if (data.gaze_state) el.ofGazeState.textContent = data.gaze_state;
        if (data.pose) {
            if (data.pose.yaw   !== undefined) el.poseYaw.textContent   = data.pose.yaw.toFixed  ? data.pose.yaw.toFixed(1) + "°" : data.pose.yaw;
            if (data.pose.pitch !== undefined) el.posePitch.textContent = data.pose.pitch.toFixed? data.pose.pitch.toFixed(1) + "°" : data.pose.pitch;
            if (data.pose.roll  !== undefined) el.poseRoll.textContent  = data.pose.roll.toFixed ? data.pose.roll.toFixed(1) + "°" : data.pose.roll;
            // 罗盘小圆点位置：yaw ±30° 映射到 ±40px
            if (data.pose.yaw !== undefined && data.pose.pitch !== undefined) {
                const dx = Math.max(-40, Math.min(40, data.pose.yaw / 30 * 40));
                const dy = Math.max(-40, Math.min(40, data.pose.pitch / 30 * 40));
                // [2026-08-09 生硬感修复] dx/dy 不再直接写进 transform，而是交给
                // smoothAnimLoop 做逐帧插值：圆点会连续、平滑地"追"向新坐标，
                // 而不是每 1.5s 数据到达时才"停顿-猛冲"一次（用户反馈"头部视线
                // 过渡生硬且慢"正是这个问题）。x/y 各自独立插值，插值完成后
                // 统一在 applyGazeDotTransform 里合并写一次 transform。
                setSmoothTarget("gazeDotX", dx);
                setSmoothTarget("gazeDotY", dy);
            }
        }
        if (data.pose_deviation_60s !== undefined)
            el.poseDev.textContent = (data.pose_deviation_60s*100).toFixed(0) + "%";

        // ---- 注意力 & 眼动 ----
        if (data.attention !== undefined) {
            el.attScore.innerHTML = `${data.attention}<span class="slash">/100</span>`;
        }
        if (data.blink_rate !== undefined) el.blinkRate.textContent = data.blink_rate.toFixed(1) + "/min";
        if (data.perclos !== undefined)    el.perclos.textContent   = (data.perclos*100).toFixed(1) + "%";
        if (data.gaze_stability !== undefined) el.gazeStab.textContent = data.gaze_stability.toFixed(2);
        if (data.ear_l !== undefined && data.ear_r !== undefined)
            el.earLr.textContent = data.ear_l.toFixed(2) + " / " + data.ear_r.toFixed(2);
        if (data.fatigue) el.fatigue.textContent = data.fatigue;

        // ---- AU 详情 ----
        const auStr = data.au_text ?? (Array.isArray(data.au) ? data.au.join(", ") : data.au) ?? "--";
        el.ofAu.textContent = safeText(auStr);
        if (data.au_dominant) el.auDominant.textContent = "主导：" + data.au_dominant;
        if (data.au_intensity) {
            const ai = data.au_intensity;
            // 单个 AU 直接对应一根横线；"眉毛"合并 AU01(内眉上扬)+AU02(外眉上扬) 取均值，
            // 因为模型实际只输出 8 维 AU（无 AU07/AU45），这两项已从 UI 里去掉。
            const map = {
                AU12: ["au12-bar","au12-val"], AU06: ["au06-bar","au06-val"],
                AU04: ["au04-bar","au04-val"], AU25: ["au25-bar","au25-val"],
                AU09: ["au09-bar","au09-val"]
            };
            // OpenFace 3.0 的 AU 回归头输出是 0~1 的强度，但真实微表情场景下绝大多数
            // AU 的日常波动范围很窄（0~0.1 左右），只有说话张嘴时 AU25/AU26 会到 0.3~0.6。
            const AU_DISPLAY_MAX = {
                AU12: 0.3, AU06: 0.3, AU04: 0.3, AU09: 0.3,
                AU25: 0.6, AU01: 0.3, AU02: 0.3
            };
            // [2026-08-09 动态伸缩动画重构] 用户明确要求："根据后面数值的变动做一个
            // 伸缩波动的动画"——之前只做了"宽度线性映射 + CSS transition"，但存在两个
            // 问题：① AU 值经常在 0.00~0.03 这种极小范围内波动，即使做了 displayMax
            // 放大，线性映射下的横条宽度差异也只有几个百分点，肉眼几乎看不出"动了"；
            // ② 如果两次数值完全相同（模型输出在两帧间没变化），横条自然也不应该动，
            // 但之前没有任何机制主动提示"这一帧数据是新的"。
            // 这里做两处改进：
            //   1. 用 sqrt 而不是线性映射横条宽度：pct = sqrt(v/cap)*100，这样低数值
            //      区间会被进一步视觉放大（例如 v/cap=0.03 时，线性只有3%宽度，sqrt
            //      映射后约17.3%，肉眼可辨），同时仍保持"值越大条越长"的单调关系。
            //   2. 每次数值相对上一次发生变化（哪怕变化很小）时，给横条加一次
            //      "拉伸+发光"的 CSS 脉冲动画（au-pulse class），明确提示用户"这一帧
            //      刷新了、数据在变化"，而不只是依赖横条宽度本身的微小差异。
            function setAuBar(barId, valId, v) {
                const barEl = document.getElementById(barId);
                const valEl = document.getElementById(valId);
                if (!barEl || !valEl) return;
                const cap = AU_DISPLAY_MAX[barId.replace("-bar","").toUpperCase()] || 0.3;
                const ratio = Math.max(0, Math.min(1, v / cap));
                const pct = Math.sqrt(ratio) * 100;   // sqrt 放大低数值区间
                const scale = pct / 100;
                // [2026-08-09 生硬感修复] 不再直接赋值 transform，而是把新的目标
                // scaleX 值交给 smoothAnimLoop 做逐帧插值：横条会用连续、匀速感的
                // 运动"追"到新长度，而不是每 1.5s 数据到达时才做一次性过渡。
                registerSmoothTarget(barId, scale, (cur) => {
                    barEl.style.transform = `scaleX(${cur.toFixed(4)})`;
                }, SMOOTH_FACTOR_VALUE);
                setSmoothTarget(barId, scale);
                valEl.textContent = v.toFixed(2);
                const prev = auLastValues[barId];
                if (prev === undefined || Math.abs(prev - v) > 0.0005) {
                    // 数值确实变化了（哪怕变化幅度极小）：重新触发一次脉冲动画。
                    // [2026-08-09 卡涩修复] 之前用 void barEl.offsetWidth 强制同步
                    // 重排来"清零"动画状态，这个读取本身就会强制浏览器立即计算
                    // 布局，属于比较昂贵的操作；改用 requestAnimationFrame 在下一帧
                    // 再补加 class，同样能让浏览器把动画重新播放一次，但不需要
                    // 强制同步重排，更省性能。
                    barEl.classList.remove("au-pulse");
                    requestAnimationFrame(() => barEl.classList.add("au-pulse"));
                }
                auLastValues[barId] = v;
            }
            Object.entries(map).forEach(([k, [bId, vId]]) => {
                const v = ai[k];
                if (v !== undefined) setAuBar(bId, vId, v);
            });
            if (ai.AU01 !== undefined || ai.AU02 !== undefined) {
                const vals = [ai.AU01, ai.AU02].filter(v => v !== undefined);
                const vBrow = vals.reduce((a,b) => a+b, 0) / vals.length;
                setAuBar("aubrow-bar", "aubrow-val", vBrow);
            }
        }
        if (data.au_symmetry !== undefined) el.auSym.textContent      = (data.au_symmetry*100).toFixed(0) + "%";
        if (data.au_activity !== undefined) el.auActivity.textContent = (data.au_activity*100).toFixed(0) + "%";

        // ---- 异常检测 ----
        if (data.anomaly) {
            if (data.anomaly.level) el.anomLevel.textContent = data.anomaly.level;
            if (data.anomaly.gaze_dev !== undefined) el.anomGaze.textContent  = (data.anomaly.gaze_dev*100).toFixed(0) + "%";
            if (data.anomaly.blink_high) el.anomBlink.textContent = data.anomaly.blink_high;
            if (data.anomaly.brow_dur !== undefined) el.anomBrow.textContent = data.anomaly.brow_dur + "s";
            if (data.anomaly.advice)    el.anomAdvice.textContent = "建议：" + data.anomaly.advice;
        }

        // ---- HUD ----
        if (data.confidence !== undefined) el.hudConf.textContent = "Conf " + data.confidence.toFixed(2);
        // [2026-08-09 摄像头 HUD 人脸状态优化] 同"人脸检测"卡片一致语义：
        // face_count>0 时圆点变绿+文案"人脸"（隐含"已检测到"），否则圆点变红。
        // 不再显示写死的数字"1"，避免误导成"人脸数量统计"。
        if (data.face_count !== undefined && el.hudFaceDot) {
            const hasFace = Number(data.face_count) > 0;
            el.hudFaceDot.classList.toggle("on", hasFace);
            el.hudFaceDot.classList.toggle("off", !hasFace);
        }
        if (data.latency_ms !== undefined) el.hudLatency.textContent = data.latency_ms + "ms";

        // 是否为示例数据的顶栏标记
        // [2026-08-09 修复] au-tag（面部AU面板头部的"示例"徽章）此前一直硬编码在HTML里，
        // 没有任何JS更新逻辑，导致即使真实数据已经在正常更新，徽章仍永久显示"示例"，
        // 容易被误判为"整块AU面板都是假数据/没生效"。这里补上与顶栏 top-demo-tag
        // 完全一致的逻辑：拿到 is_demo===false 的真实数据后隐藏"示例"徽章。
        if (data.is_demo === false) {
            el.topDemoTag.style.display = "none";
            if (el.auTag) el.auTag.style.display = "none";
        }
    }

    function startOpenFaceMonitoring() {
        // [2026-08-09 性能优化] 同样加 inFlight 防护：如果上一次 /get_openface
        // 请求还没返回（网络慢/服务端忙时可能超过 1.5s 的轮询间隔），本次直接
        // 跳过，避免和抓帧上传循环一样出现请求堆积、争抢浏览器网络连接和主线程。
        let ofTickInFlight = false;
        async function tick() {
            if (ofTickInFlight) return;
            ofTickInFlight = true;
            try {
                const r = await fetch("/get_openface", { cache: "no-store" });
                if (!r.ok) throw new Error("HTTP " + r.status);
                const d = await r.json();
                renderOpenFace(d);
            } catch (e) {
                console.error("OpenFace 获取失败:", e);
                renderOpenFace({ status: "error", message: "OpenFace 获取失败" });
            } finally {
                ofTickInFlight = false;
            }
        }
        tick();
        setInterval(tick, config.openfaceInterval);
    }

    // ========== [2026-08-11 波形前端化] AM波形 + BPM趋势 Canvas 本地渲染 ==========
    // 数据：/get_wave_data 每300ms轮询一次(约3KB JSON)。wave_t 是每个数据点的
    // "年龄"(相对服务端now的秒数)。渲染：requestAnimationFrame 60fps，x坐标 =
    // (本地流逝时间 + 数据点年龄) 映射到 [0, WAVE_WINDOW_S] 秒窗口，因此即使数据
    // 300ms才到一批，波形也在每一帧里匀速左移——彻底消除"停顿-猛冲"。
    function startWaveCanvas() {
        const cv = document.getElementById("hrTrendCanvas");
        if (!cv) return;
        const wctx = cv.getContext("2d");
        const W = cv.width, H = cv.height;
        const ML = 90, MR = 30, MT = 50, MB = 70;   // 边距(2x缩放：对应后端45/15/25/35)
        const PW = W - ML - MR, PH = H - MT - MB;
        const WAVE_WINDOW_S = 12;      // 波形显示窗口(秒)
        const HR_Y_MIN = 40, HR_Y_MAX = 180;
        const HR_HISTORY_SPAN_S = 30;  // BPM趋势条目数60 * 0.5s间隔

        // 与后端 MJPEG 版一致的配色(BGR->CSS)
        const C_BG = "#121612", C_GRID = "#233723", C_AXIS = "#5a825a";
        const C_WAVE = "#3cdc5a", C_BPM = "#ffa500", C_TEXT = "#bed2be", C_NUM = "#ffffff";

        // ==== [2026-08-11 带式记录仪重构] ====
        // 前两版的失败教训：
        //   v1 按每点真实时间戳定位x => 批内密集批间稀疏，"密集簇+长直线"断续感;
        //   v2 每次拉取整体替换缓冲+重算间距 => 每300ms整条波形重新排版：
        //      scrollPx归零造成左右晃动、pxPerPoint变化造成橡皮筋伸缩、
        //      EMA写在60fps循环里等于失效造成纵向脉动 —— 即"视觉灾难"。
        // 正确模型 = 经典带式记录仪(strip chart)：
        //   1. 本地维护【只追加】的样本队列，每个样本获得永久递增序号seq；
        //      用 server_now - age 还原服务端绝对时间戳做去重，旧点绝不重排。
        //   2. 屏幕x = (displayHead - seq) * 恒定像素间距 —— 样本间距永不变，
        //      已画上屏的波形形状永不变形。
        //   3. displayHead(滚动头,浮点样本数)用本地时钟按平滑速率匀速推进，
        //      并向真实最新序号headSeq温和追赶(比例纠偏)，永不回退 => 波形
        //      只会匀速向左流动，绝无倒退/跳变。
        //   4. y轴范围只在数据到达时做EMA(0.2/次)，渲染帧内不动 => 无脉动。
        const VISIBLE_SAMPLES = 135;         // 屏宽容纳的样本数(=后端缓冲长度)
        const PX_PER_SAMPLE = PW / (VISIBLE_SAMPLES - 1);
        const samples = [];                  // 本地样本队列(只追加,容量400)
        let headSeq = 0;                     // 已追加的样本总数(最新样本序号+1)
        let baseSeq = 0;                     // samples[0]对应的序号
        let lastTotal = -1;                  // 后端累计追加计数(精确识别新点,去重用)
        let displayHead = 0;                 // 平滑滚动头(浮点,样本单位)
        let flowRate = 13;                   // 样本流速EMA(个/秒),初值≈effective_fs
        let lastRateT = 0;                   // 上次速率估计的本地时刻
        let yMin = null, yMax = null;        // y轴范围(仅数据到达时EMA更新)
        let hrHist = [], hrDisplay = "--";
        let fetchInFlight = false;

        async function fetchWave() {
            if (fetchInFlight) return;
            fetchInFlight = true;
            try {
                const r = await fetch("/get_wave_data", { cache: "no-store" });
                if (!r.ok) return;
                const d = await r.json();
                if (d.status !== "success") return;
                hrHist = d.hr_history; hrDisplay = d.hr_display;
                const w = d.wave;
                const tc = (typeof d.total_count === "number") ? d.total_count : -1;
                let added = 0;
                if (tc >= 0) {
                    // v4: 用后端单调计数差精确识别新点。
                    // (时间戳去重已证明不可靠: 每次拉取还原的时间戳抖动±1~3ms,
                    //  旧点被反复误判为新点, 队列被污染 => 波形变形/回弹。)
                    if (lastTotal < 0) {
                        // 首次拉取: 整个缓冲区一次性入队
                        for (const v of w) { samples.push(v); headSeq++; added++; }
                        lastTotal = tc;
                    } else if (tc > lastTotal) {
                        let newPts = tc - lastTotal;
                        if (newPts > w.length) newPts = w.length;   // 超出缓冲的已丢失
                        for (let i = w.length - newPts; i < w.length; i++) {
                            samples.push(w[i]); headSeq++; added++;
                        }
                        lastTotal = tc;
                    }
                    // tc <= lastTotal: 无新数据(或会话重置由页面刷新处理), 不追加
                }
                if (samples.length > 400) {              // 队列封顶
                    const drop = samples.length - 400;
                    samples.splice(0, drop); baseSeq += drop;
                }
                const nowL = performance.now() / 1000;
                if (added > 0) {
                    if (lastRateT > 0) {
                        const dt = nowL - lastRateT;
                        if (dt > 0.05) {
                            const inst = added / dt;     // 瞬时流速
                            flowRate += 0.25 * (Math.min(40, inst) - flowRate);
                        }
                    }
                    lastRateT = nowL;
                    if (displayHead === 0) displayHead = headSeq;  // 首批直接对齐
                    // y轴范围：对当前可见窗口求min/max，EMA温和跟随(每次数据到达才更新)
                    const vis = samples.slice(-VISIBLE_SAMPLES);
                    let mn = Infinity, mx = -Infinity;
                    for (const v of vis) { if (v < mn) mn = v; if (v > mx) mx = v; }
                    if (yMin === null) { yMin = mn; yMax = mx; }
                    else { yMin += 0.2 * (mn - yMin); yMax += 0.2 * (mx - yMax); }
                }
            } catch (e) { /* 网络抖动忽略，继续用现有队列渲染 */ }
            finally { fetchInFlight = false; }
        }
        fetchWave();
        setInterval(fetchWave, 300);

        function draw() {
            // 背景 + 网格
            wctx.fillStyle = C_BG;
            wctx.fillRect(0, 0, W, H);
            wctx.strokeStyle = C_GRID; wctx.lineWidth = 1;
            wctx.beginPath();
            for (let i = 0; i <= 6; i++) {
                const gy = MT + i * PH / 6;
                wctx.moveTo(ML, gy); wctx.lineTo(ML + PW, gy);
            }
            for (let i = 0; i <= 10; i++) {
                const gx = ML + i * PW / 10;
                wctx.moveTo(gx, MT); wctx.lineTo(gx, MT + PH);
            }
            wctx.stroke();
            // 主轴
            wctx.strokeStyle = C_AXIS;
            wctx.beginPath();
            wctx.moveTo(ML, MT); wctx.lineTo(ML, MT + PH); wctx.lineTo(ML + PW, MT + PH);
            wctx.stroke();

            // --- AM 波形(绿)：带式记录仪渲染 ---
            // displayHead 匀速推进 + 比例追赶真实headSeq；每个样本x坐标只由
            // 其永久序号决定 => 形状刚性左移，无伸缩/无倒退/无重排。
            if (samples.length > 1 && yMin !== null) {
                const nowMs = performance.now();
                if (!draw._lastMs) draw._lastMs = nowMs;
                const dt = Math.min(0.1, (nowMs - draw._lastMs) / 1000);
                draw._lastMs = nowMs;

                // 匀速推进 + 温和追赶(滞后/超前时按比例修正，永不回退)
                let advance = flowRate * dt;
                const lag = headSeq - displayHead;       // 正=落后于真实数据
                advance += lag * 0.8 * dt;               // 比例纠偏(时间常数~1.25s)
                if (advance < 0) advance = 0;            // 绝不倒退
                displayHead += advance;
                // 硬边界：显示头不越过真实最新点，也不落后超过一屏
                if (displayHead > headSeq) displayHead = headSeq;
                if (displayHead < headSeq - VISIBLE_SAMPLES) displayHead = headSeq - VISIBLE_SAMPLES;

                const range = (yMax - yMin) > 1e-6 ? (yMax - yMin) : 1;
                wctx.save();
                wctx.beginPath(); wctx.rect(ML, MT, PW, PH); wctx.clip();
                wctx.strokeStyle = C_WAVE; wctx.lineWidth = 2;
                wctx.beginPath();
                let started = false;
                const iEnd = Math.min(samples.length, Math.ceil(displayHead) - baseSeq);
                const iStart = Math.max(0, Math.floor(displayHead - VISIBLE_SAMPLES) - baseSeq);
                for (let i = iStart; i < iEnd; i++) {
                    const seq = baseSeq + i;
                    const x = ML + PW - (displayHead - seq) * PX_PER_SAMPLE;  // 新点在右
                    let vv = (samples[i] - yMin) / range;
                    vv = Math.min(1, Math.max(0, vv));
                    const y = MT + (1 - vv) * PH;
                    if (!started) { wctx.moveTo(x, y); started = true; }
                    else wctx.lineTo(x, y);
                }
                wctx.stroke();
                wctx.restore();
            }

            // --- BPM 趋势线(橙) --- 数据0.5s一点，做简单lerp平滑即可
            const hh = hrHist;
            if (hh.length > 1) {
                wctx.strokeStyle = C_BPM; wctx.lineWidth = 4;
                wctx.beginPath();
                for (let i = 0; i < hh.length; i++) {
                    const v = Math.min(HR_Y_MAX, Math.max(HR_Y_MIN, hh[i]));
                    const x = ML + i * PW / Math.max(1, hh.length - 1);
                    const y = MT + (1 - (v - HR_Y_MIN) / (HR_Y_MAX - HR_Y_MIN)) * PH;
                    if (i === 0) wctx.moveTo(x, y); else wctx.lineTo(x, y);
                }
                wctx.stroke();
            }

            // --- Y轴刻度 ---
            wctx.fillStyle = C_TEXT; wctx.font = "20px sans-serif"; wctx.textAlign = "right";
            for (let i = 0; i <= 5; i++) {
                const val = HR_Y_MIN + i * (HR_Y_MAX - HR_Y_MIN) / 5;
                const y = MT + PH - i * PH / 5;
                wctx.fillText(String(Math.round(val)), ML - 8, y + 7);
            }
            // 轴标签
            wctx.textAlign = "left";
            wctx.fillText("BPM", 6, MT + PH / 2);
            wctx.textAlign = "center";
            wctx.fillText(`time (~${HR_HISTORY_SPAN_S}s)`, ML + PW / 2, H - 20);
            wctx.textAlign = "left";
            wctx.fillText("0s", ML, H - 20);

            // --- 右上角大号BPM数字 ---
            wctx.fillStyle = C_NUM; wctx.font = "bold 56px sans-serif"; wctx.textAlign = "right";
            wctx.fillText(String(hrDisplay), W - MR - 70, MT + 55);
            wctx.fillStyle = C_TEXT; wctx.font = "22px sans-serif"; wctx.textAlign = "left";
            wctx.fillText("BPM", W - MR - 60, MT + 55);

            requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
    }

    async function init() {
        try {
            await setupWebcam();
            startHeartRateMonitoring();
            startOpenFaceMonitoring();
            startWaveCanvas();
        } catch (err) {
            console.error("初始化失败:", err);
        }
    }
    window.addEventListener("DOMContentLoaded", init);
<\/script>
