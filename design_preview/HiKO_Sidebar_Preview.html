<style>
/* ==================================================================
   HiKO 侧边导航外壳 (shell)
   ------------------------------------------------------------------
   设计原则：本文件不包含任何首页样式，首页通过 <iframe> 原样加载。
   iframe 天然隔离 CSS/JS，因此首页布局与元素 100% 不受影响。

   色板取自首页 templates/index.html：
     主青 #00F7FF · 淡青 #9BFFFB · 绿 #00E1A6 · 黄 #FFD466
     面板底 rgba(39,70,133,.28) · 灰字 #B6BCC7 / #6C82A6
   ================================================================== */
:root{
  --cyan:#00F7FF;
  --cyan-2:#9BFFFB;
  --green:#00E1A6;
  --yellow:#FFD466;
  --red:#FF5C5C;
  --white:#FFFFFF;
  --gray:#B6BCC7;
  --gray-2:#6C82A6;
  --panel:rgba(39,70,133,.28);
  --bd:rgba(0,247,255,.35);
  --bd-soft:rgba(0,247,255,.18);

  /* 关键几何：与首页对齐 */
  --nav-w:96px;   /* 导航栏宽度 */
  --top-h:70px;   /* 首页 .bg-top 高度，保持顶栏完全可见 */
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#050d1c;color:#EBEBEB;
  font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;
}

/* ============ 首页容器（iframe，原样加载，不缩放） ============ */
#home-frame{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  border:0;display:block;
  background:#050d1c;
}
/* 窄屏时把首页向右推，避免导航栏遮挡内容 */
body.push-mode #home-frame{
  left:var(--nav-w);
  width:calc(100% - var(--nav-w));
}

/* ============ 侧边导航栏 ============ */
.sidenav{
  position:fixed;left:0;top:0;bottom:0;
  width:var(--nav-w);
  padding:calc(var(--top-h) + 10px) 8px 20px;
  display:flex;flex-direction:column;gap:12px;
  background:linear-gradient(180deg,rgba(5,20,55,.92),rgba(8,28,70,.88));
  border-right:1px solid var(--bd);
  z-index:60;
}
.sidenav::before{
  content:"";position:absolute;top:0;right:-1px;bottom:0;width:1px;
  background:linear-gradient(180deg,transparent,var(--cyan),transparent);
  opacity:.6;
}
.nav-item{
  position:relative;padding:12px 4px 10px;border-radius:6px;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  border:1px solid var(--bd-soft);
  background:rgba(0,60,150,.12);
  cursor:pointer;user-select:none;
  transition:all .25s ease;
}
.nav-item .ico{
  width:22px;height:22px;color:var(--cyan-2);
  filter:drop-shadow(0 0 4px rgba(0,247,255,.45));
}
.nav-item .ico svg{width:100%;height:100%;}
.nav-item .txt{
  font-size:11px;line-height:1.4;letter-spacing:1px;text-align:center;
  color:var(--gray);
}
.nav-item:hover{
  background:rgba(0,120,255,.22);border-color:var(--cyan);
  transform:translateX(2px);
}
.nav-item:hover .txt{color:#fff;}
.nav-item.active{
  background:linear-gradient(135deg,rgba(0,140,255,.4),rgba(0,80,200,.25));
  border-color:var(--cyan);
  box-shadow:0 0 16px rgba(0,247,255,.35), inset 0 0 20px rgba(0,247,255,.12);
}
.nav-item.active .ico{color:var(--cyan);filter:drop-shadow(0 0 6px var(--cyan));}
.nav-item.active .txt{color:#fff;font-weight:bold;}

/* ============ 遮罩 ============ */
.overlay{
  position:fixed;top:var(--top-h);left:var(--nav-w);right:0;bottom:0;
  background:rgba(2,8,25,.55);
  backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .3s;
  z-index:50;
}
.overlay.show{opacity:1;pointer-events:auto;}

/* ============ 弹窗面板 ============ */
.popup{
  position:fixed;
  top:var(--top-h);left:var(--nav-w);right:0;bottom:0;
  z-index:55;
  background:
    radial-gradient(1200px 600px at 70% 110%, rgba(0,80,200,.15), transparent 60%),
    radial-gradient(900px 500px at 15% 90%, rgba(0,120,255,.1), transparent 60%),
    linear-gradient(135deg,rgba(8,22,58,.97),rgba(5,15,40,.97));
  border-left:1px solid var(--cyan);
  box-shadow:20px 0 60px rgba(0,0,0,.6), inset 60px 0 80px rgba(0,140,255,.08);
  transform:translateX(-105%);
  transition:transform .38s cubic-bezier(.22,.9,.3,1);
  display:flex;flex-direction:column;overflow:hidden;
}
.popup.show{transform:translateX(0);}

.p-head{
  flex:0 0 58px;display:flex;align-items:center;gap:14px;
  padding:0 26px;position:relative;
  background:linear-gradient(90deg,rgba(0,120,255,.25),transparent 70%);
  border-bottom:1px solid var(--bd);
}
.p-head::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;
  background:var(--cyan);box-shadow:0 0 8px var(--cyan);
}
.p-head .p-ico{width:26px;height:26px;color:var(--cyan);flex:0 0 26px;
  filter:drop-shadow(0 0 6px rgba(0,247,255,.5));}
.p-head .p-ico svg{width:100%;height:100%;}
.p-head h2{font-size:18px;color:var(--white);letter-spacing:3px;font-weight:500;
  text-shadow:0 0 12px rgba(0,247,255,.6);white-space:nowrap;}
.p-head .p-sub{font-size:11px;color:var(--gray-2);letter-spacing:2px;}
.p-head .p-tools{margin-left:auto;display:flex;align-items:center;gap:10px;}
.p-head .p-tools .tool{
  width:30px;height:30px;border:1px solid var(--bd);border-radius:3px;
  background:rgba(0,120,255,.08);color:var(--cyan-2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;
}
.p-head .p-tools .tool:hover{background:rgba(0,247,255,.2);color:#fff;}
.p-head .p-tools .tool svg{width:14px;height:14px;}
.p-head .breadcrumb{font-size:11px;color:var(--gray-2);letter-spacing:2px;}
.p-head .breadcrumb .cur{color:var(--cyan);}

.p-body{flex:1;overflow-y:auto;padding:22px 28px 28px;}
.p-body::-webkit-scrollbar{width:6px;}
.p-body::-webkit-scrollbar-thumb{background:rgba(0,247,255,.3);border-radius:3px;}

.p-foot{
  height:28px;background:rgba(5,15,40,.8);border-top:1px solid var(--bd-soft);
  display:flex;align-items:center;padding:0 26px;gap:20px;
  font-size:10px;color:var(--gray-2);letter-spacing:2px;
}
.p-foot .live{color:var(--green);}
.p-foot .live::before{content:"● ";}

/* ============ 通用组件（沿用首页视觉规范） ============ */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}

.pcard{
  background:var(--panel);border:1px solid var(--bd-soft);
  border-radius:4px;padding:16px;position:relative;
}
.pcard.hi{border-color:var(--bd);box-shadow:0 0 12px rgba(0,247,255,.08);}
.pcard::before{content:"";position:absolute;top:16px;left:0;width:4px;height:14px;background:var(--cyan);}
.pcard h4{font-size:14px;color:var(--cyan-2);letter-spacing:1px;
  margin-bottom:12px;padding-left:12px;font-weight:bold;}
.pcard h4 .tag{float:right;font-size:11px;color:var(--gray-2);font-weight:normal;
  padding:2px 8px;border:1px solid var(--bd-soft);border-radius:3px;}

.section-title{
  font-size:14px;color:var(--cyan-2);letter-spacing:2px;font-weight:bold;
  margin:0 0 14px;padding-left:12px;position:relative;
  display:flex;align-items:center;justify-content:space-between;
}
.section-title::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:4px;
  background:var(--cyan);box-shadow:0 0 6px var(--cyan);}
.section-title .aside{font-size:11px;color:var(--gray-2);font-weight:normal;letter-spacing:1px;}

.big-num{font-size:36px;font-weight:bold;color:var(--white);line-height:1;
  text-shadow:0 0 12px rgba(0,247,255,.4);}

.tinytag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;
  letter-spacing:1px;border:1px solid var(--bd-soft);color:var(--gray);}
.tinytag.g{background:rgba(0,225,166,.12);color:var(--green);border-color:rgba(0,225,166,.4);}
.tinytag.o{background:rgba(255,212,102,.12);color:var(--yellow);border-color:rgba(255,212,102,.4);}
.tinytag.c{background:rgba(0,247,255,.12);color:var(--cyan);border-color:rgba(0,247,255,.4);}
.tinytag.r{background:rgba(255,92,92,.12);color:var(--red);border-color:rgba(255,92,92,.4);}

.kv{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;
  border-bottom:1px dashed var(--bd-soft);}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--gray);}
.kv .v{color:var(--white);font-weight:bold;}
.kv .v.ok{color:var(--green);}
.kv .v.warn{color:var(--yellow);}
.kv .v.bad{color:var(--red);}

.hbar{margin:10px 0;}
.hbar .t{display:flex;justify-content:space-between;font-size:12px;color:var(--gray);margin-bottom:5px;}
.hbar .t b{color:var(--white);}
.hbar .b{height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden;}
.hbar .b i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,#00E1A6,#00F7FF);box-shadow:0 0 6px rgba(0,247,255,.4);}

.au-line{display:grid;grid-template-columns:100px 1fr 46px;align-items:center;gap:10px;
  font-size:12px;padding:5px 0;}
.au-line .n{color:var(--gray);}
.au-line .tr{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;}
.au-line .fl{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#00E1A6,#00F7FF);}
.au-line .v{text-align:right;color:var(--white);font-weight:bold;font-family:Consolas,monospace;}

.ring-box{display:flex;align-items:center;gap:22px;}
.ring{position:relative;width:120px;height:120px;flex:0 0 120px;}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.ring .rv{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;}
.ring .rv b{font-size:28px;color:var(--white);font-weight:bold;text-shadow:0 0 10px rgba(0,247,255,.5);}
.ring .rv span{font-size:11px;color:var(--gray-2);letter-spacing:1px;margin-top:2px;}

.advice{
  background:rgba(0,225,166,.08);border:1px solid rgba(0,225,166,.3);
  border-left:3px solid var(--green);
  border-radius:4px;padding:14px 16px;font-size:12px;line-height:2;color:#DFF;
}
.advice ul{list-style:none;}
.advice li{padding-left:16px;position:relative;}
.advice li::before{content:"›";position:absolute;left:0;color:var(--green);font-weight:bold;}
.advice b{color:var(--green);}

.timeline{position:relative;padding-left:22px;}
.timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(180deg,var(--cyan),rgba(0,247,255,.1));}
.timeline .item{position:relative;margin-bottom:14px;font-size:12px;padding-left:8px;}
.timeline .item::before{content:"";position:absolute;left:-20px;top:5px;width:8px;height:8px;
  border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);}
.timeline .item .time{color:var(--cyan-2);font-weight:bold;margin-right:8px;font-family:Consolas,monospace;}
.timeline .item .t{color:var(--white);}
.timeline .item .d{font-size:11px;color:var(--gray);margin-top:3px;line-height:1.6;}

.scene-card{
  background:var(--panel);border:1px solid var(--bd-soft);border-radius:6px;
  padding:20px 16px;text-align:center;cursor:pointer;transition:.25s;
}
.scene-card:hover{border-color:var(--cyan);transform:translateY(-3px);
  box-shadow:0 8px 24px rgba(0,140,255,.25);}
.scene-card .si{width:44px;height:44px;margin:0 auto 12px;color:var(--cyan);}
.scene-card .si svg{width:100%;height:100%;}
.scene-card h5{font-size:14px;color:var(--white);margin-bottom:6px;letter-spacing:1px;}
.scene-card p{font-size:11px;color:var(--gray);line-height:1.7;}
.scene-card .st{margin-top:10px;}

.face-map{
  aspect-ratio:1;position:relative;
  background:radial-gradient(ellipse at 30% 40%,rgba(255,92,92,.28),transparent 35%),
             radial-gradient(ellipse at 70% 45%,rgba(255,212,102,.25),transparent 35%),
             radial-gradient(ellipse at 50% 65%,rgba(0,225,166,.22),transparent 40%),
             rgba(20,40,80,.55);
  border:1px solid var(--bd-soft);border-radius:6px;
}
.face-map::before{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:60%;height:75%;border:1.5px dashed rgba(0,247,255,.4);
  border-radius:50% 50% 45% 45% / 60% 60% 40% 40%;
}
.face-legend{display:flex;justify-content:space-between;margin-top:8px;font-size:10px;color:var(--gray);}
.face-legend .lb{display:flex;align-items:center;gap:4px;}
.face-legend .sw{width:10px;height:10px;border-radius:2px;}

/* 示例数据提示 */
.mock-note{
  display:inline-block;margin-left:10px;padding:2px 8px;border-radius:3px;
  font-size:10px;letter-spacing:1px;
  background:rgba(255,180,0,.15);border:1px solid rgba(255,180,0,.5);color:var(--yellow);
}
</style>
</head>
<body>

<!-- ============================================================
     首页：原样 iframe 加载 /max，不做任何缩放或样式覆盖
     ============================================================ -->
<iframe id="home-frame" title="HiKO数字生理感知"
        allow="camera; microphone; autoplay"></iframe>

<!-- 侧边导航栏 -->
<nav class="sidenav" id="sidenav"></nav>
<div style="position:fixed;right:12px;bottom:10px;z-index:200;font-size:11px;letter-spacing:1px;
 color:rgba(155,255,251,.75);background:rgba(5,13,28,.75);border:1px solid rgba(0,247,255,.25);
 padding:5px 12px;border-radius:3px;">离线预览 · 首页为真实模板(已桩掉摄像头/后端) · 生产用 /v2 加载实时首页</div>

<!-- 弹窗层 -->
<div class="overlay" id="overlay"></div>
<div id="popup-container"></div>

<script>
/* ==============================================================
   图标
   ============================================================== */
const ICONS = {
  status: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>`,

  bio:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h3l2-6 4 12 2-6h7"/></svg>`,
  skin:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><ellipse cx="12" cy="11" rx="6" ry="8"/><circle cx="10" cy="10" r=".8" fill="currentColor"/><circle cx="14" cy="12" r=".8" fill="currentColor"/><circle cx="11" cy="14" r=".8" fill="currentColor"/></svg>`,
  scene:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="M3 9h18M8 5v14"/></svg>`,
  plan:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>`,

<script>
/* ==============================================================
   构建导航 + 交互
   ============================================================== */
const sidenav = document.getElementById('sidenav');
const overlay = document.getElementById('overlay');
const popupContainer = document.getElementById('popup-container');
let currentPopup = null, currentKey = null;

NAV_ITEMS.forEach(item=>{
  const el = document.createElement('div');
  el.className = 'nav-item' + (item.home ? ' active' : '');
  el.dataset.id = item.id;
  el.innerHTML = `<div class="ico">${ICONS[item.icon]}</div><div class="txt">${item.label}</div>`;
  sidenav.appendChild(el);
});

function setActive(id){
  sidenav.querySelectorAll('.nav-item').forEach(n=>{
    n.classList.toggle('active', n.dataset.id === id);
  });
}

function buildPopup(key){
  const cfg = PANELS[key];
  const el = document.createElement('div');
  el.className = 'popup';
  el.innerHTML = `
    <div class="p-head">
      <div class="p-ico">${ICONS[cfg.icon]}</div>
      <h2>${cfg.title}</h2>
      <span class="p-sub">${cfg.sub}</span>
      <span class="mock-note">示例数据 · 未接入实时模型</span>
      <div class="p-tools">
        <span class="breadcrumb">HiKO · <span class="cur">${cfg.title}</span></span>
        <div class="tool" data-export title="导出">${ICONS.export}</div>
        <div class="tool" data-close title="关闭">${ICONS.close}</div>
      </div>
    </div>
    <div class="p-body">${cfg.render()}</div>
    <div class="p-foot">
      <span class="live">首页检测持续运行中</span>
      <span>模型 v2.4.1</span>
      <span style="margin-left:auto;">ESC / 点击遮罩 / 再次点击导航项 均可关闭</span>
    </div>
  `;
  el.querySelector('[data-close]').addEventListener('click', closePopup);
  popupContainer.appendChild(el);
  return el;
}

function openPopup(key){
  if(!PANELS[key]) return;
  if(currentKey === key){ closePopup(); return; }
  if(currentPopup){ currentPopup.remove(); currentPopup = null; }
  currentKey = key;
  currentPopup = buildPopup(key);
  overlay.classList.add('show');
  requestAnimationFrame(()=>requestAnimationFrame(()=>currentPopup.classList.add('show')));
  setActive(key);
}

function closePopup(){
  if(!currentPopup) return;
  currentPopup.classList.remove('show');
  overlay.classList.remove('show');
  const p = currentPopup; currentPopup = null; currentKey = null;
  setTimeout(()=>p.remove(), 400);
  setActive('status');
}

sidenav.addEventListener('click', e=>{
  const item = e.target.closest('.nav-item');
  if(!item) return;
  const id = item.dataset.id;
  if(id === 'status'){ closePopup(); setActive('status'); return; }
  openPopup(id);
});

overlay.addEventListener('click', closePopup);
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closePopup(); });

/* ==============================================================
   自适应：宽屏用叠加模式（首页完全不受影响），
           窄屏自动切换为推挤模式（避免导航栏遮挡首页内容）
   首页主容器宽度 = min(1520px, 100vw - 20px)
   宽屏时左右留白 (100vw-1520)/2 > 96px 即不会遮挡
   ============================================================== */
const HOME_MAX_W = 1520, NAV_W = 96;
function fitMode(){
  const need = HOME_MAX_W + NAV_W * 2;   // 1712px
  document.body.classList.toggle('push-mode', window.innerWidth < need);
}
fitMode();
window.addEventListener('resize', fitMode);
</script>

        .logo {
            font-size: 14px;
            color: #CFD4DF;
            margin-top: 4px;
            position: absolute;
            left: 50%;
            transform: translate(-50%, 0%);
        }

        .logo img { width: 22px; height: 15px; margin-right: 8px; }

        /* 顶栏右侧状态徽标 */
        .top-status {
            position: absolute;
            right: 30px;
            top: 22px;
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #9BFFFB;
        }
        .top-status .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #00E1A6; margin-right: 6px;
            box-shadow: 0 0 8px #00E1A6;
            animation: pulse 1.5s infinite;
        }
        .top-status .sep { color: #6C82A6; margin: 0 10px; }
        .top-status .demo-tag {
            background: rgba(255, 180, 0, 0.15);
            border: 1px solid rgba(255, 180, 0, 0.5);
            color: #FFD466;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            margin-left: 12px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* 响应式：小于 1280px 三列变两列 */
        @media (max-width: 1280px) {
            .main-grid { flex-wrap: wrap; }
            .col-left  { width: 100%; flex-direction: row; }
            .col-left > * { flex: 1; }
            .col-mid   { flex: 1 1 60%; }
            .col-right { width: 38%; }
        }
        /* 响应式：小于 900px 完全竖排 */
        @media (max-width: 900px) {
            .main-grid { flex-direction: column; }
            .col-left, .col-mid, .col-right { width: 100%; }
            .col-left { flex-direction: column; }
            .top-status { display: none; }
        }

        /* 主容器 - 目标 1520px, 窗口小时自动缩放 */
        .con-box {

        .panel-plain {
            background: rgba(39, 70, 133, 0.28);
            position: relative;
            box-sizing: border-box;
        }
        .panel-title {
            font-size: 14px;
            font-weight: bold;
            color: #FFFFFF;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        .panel-title .bar {
            width: 4px; height: 14px; background: #00F7FF;
            margin-right: 8px;
        }
        .panel-title .badge {
            margin-left: auto;
            font-size: 11px; font-weight: normal;
            color: #9BFFFB;
            padding: 1px 6px;
            border: 1px solid rgba(155, 255, 251, 0.35);
            border-radius: 3px;
        }
        .panel-title .badge.warn {
            color: #FFD466; border-color: rgba(255, 212, 102, 0.5);
        }
        .panel-title .badge.ok {
            color: #00E1A6; border-color: rgba(0, 225, 166, 0.5);
        }

        /* ============ 三栏主布局 (等高) ============ */
        .main-grid {
            display: flex;
            gap: 12px;
            width: 100%;
            align-items: stretch;
        }
        .col-left  { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
        .col-mid   { flex: 1;      min-width: 0;   display: flex; flex-direction: column; gap: 12px; }
        .col-right { width: 470px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
        /* 内部卡片按比例撑开填满一列 */
        .col-left  > *:last-child,
        .col-right > *:last-child { flex: 1; }

        /* ==== 左列 · 摄像头 ==== */
        .video-box {
            width: 100%; height: 340px;
            padding: 14px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .video-box video {
            width: 100%; max-width: 270px; height: 310px;
            object-fit: cover; display: block;
        }
        .video-hud {
            position: absolute;
            bottom: 20px; left: 24px; right: 24px;
            display: flex; justify-content: space-between;
            font-size: 10px; color: #9BFFFB;
            background: rgba(0,0,0,0.35);
            padding: 3px 8px; border-radius: 3px;
        }
        /* [2026-08-09 摄像头 HUD 人脸状态优化] 用户反馈原来固定写死的"1 人脸"
           文案不准确（后端 face_count 实际只是 0/1 检测结果，不是真人脸数），
           改为跟右侧"OpenFace 状态"卡的"人脸检测"字段同一套语义：检测到时
           绿色圆点+"人脸"，未检测到时红色圆点+"人脸"，颜色由 JS 动态切换
           hud-face-dot 的 background/box-shadow class。 */
        .hud-face-dot {
            display: inline-block;
            width: 6px; height: 6px; border-radius: 50%;
            margin-right: 4px;
            background: #6C82A6;
            vertical-align: middle;
        }
        .hud-face-dot.on {
            background: #00E1A6;
            box-shadow: 0 0 5px #00E1A6;
        }
        .hud-face-dot.off {
            background: #FF5C5C;
            box-shadow: 0 0 5px #FF5C5C;
        }

        /* ==== 左列 · 情绪 ==== */
        .emotion-box {
            width: 100%;
            padding: 14px;
            box-sizing: border-box;
            display: flex; flex-direction: column;
        }
        .emo-main {
            display: flex; align-items: baseline;
            margin: 4px 0 10px 0;
        }
        .emo-icon { font-size: 32px; margin-right: 10px; }
        .emo-label { font-size: 22px; font-weight: bold; color: #FFFFFF; margin-right: 12px; }
        .emo-prob  { font-size: 18px; color: #9BFFFB; }
        /* [2026-08-09 情绪分布重构] 8 类情绪横条容器：直接复用④面板 .au-row/.bar-bg/
           .bar-fg 的 flex 布局 + transform:scaleX() 合成层动画方案（该方案原本就是为了
           解决"数据频繁刷新时横条卡涩"设计的，这里同样适用，不需要重新造轮子）。
           .emo-row 只补充跟 .au-row 不同的地方：标签更宽（要放表情符号+中文），
           整体字号略小以便 8 行能放进原来 3 段色块的空间里。 */
        .emo-dist { margin: 2px 0 4px 0; }
        .emo-row { margin-bottom: 4px; }
        .emo-row .label { width: 68px; font-size: 12px; }
        .emo-row .bar-fg.emo-bar-fg {
            background: linear-gradient(90deg, #00E1A6, #00F7FF);
        }
        .emo-meta { font-size: 11px; color: #B6BCC7; margin: 6px 0 12px 0; }
        .psy-row {
            display: flex; justify-content: space-between;
            font-size: 13px; color: #EBEBEB;
            margin-bottom: 6px;
        }
        .psy-row .v { color: #9BFFFB; font-weight: bold; }
        .psy-note { font-size: 10px; color: #6C82A6; margin-top: 6px; }
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(155,255,251,0.3), transparent);
            margin: 8px 0;
        }

        /* ==== 中列 · rPPG 5指标 ==== */
        .rppg-panel {
            width: 100%;
            padding: 14px 16px;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        .rppg-tiles {
            display: flex; gap: 10px;
            height: 158px;
        }
        .rppg-tile {
            flex: 1;
            background: rgba(7, 24, 66, 0.55);
            border: 1px solid rgba(108, 190, 255, 0.35);
            border-radius: 6px;
            padding: 10px 8px;
            box-sizing: border-box;
            display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        .rppg-tile::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00F7FF, transparent);
        }
        .rppg-tile .name {
            font-size: 13px; color: #9BFFFB; letter-spacing: 1px;
        }
        .rppg-tile .value {
            font-size: 40px; font-weight: bold; color: #FFFFFF;
            line-height: 1;
            font-family: 'Segoe UI', Consolas, monospace;
        }
        .rppg-tile .value.small { font-size: 26px; }
        .rppg-tile .unit  { font-size: 11px; color: #B6BCC7; }
        .rppg-tile .range { font-size: 10px; color: #6C82A6; margin-top: 2px; }
        .rppg-tile .status-dot {
            display: inline-block;
            width: 6px; height: 6px; border-radius: 50%;
            background: #00E1A6;
            box-shadow: 0 0 6px #00E1A6;
            margin-right: 4px;
        }
        .rppg-tile .status-text { font-size: 10px; color: #00E1A6; }
        /* 未接入算法的指标：锁定态样式 */
        .rppg-tile .status-dot.locked {
            background: #6C82A6;
            box-shadow: none;
            animation: none;
        }
        .rppg-tile .status-text.locked { color: #8A97AD; }
        .rppg-tile .value.locked { color: #6C82A6; font-size: 22px; }
        /* 30s 采样中的状态点：黄色脉冲；采样完成冻结后恢复默认绿色 */
        .rppg-tile .status-dot.sampling {
            background: #FFD466;
            box-shadow: 0 0 6px #FFD466;
            animation: pulse 1.5s infinite;
        }
        .rppg-tile .status-text.sampling { color: #FFD466; }

        /* ==== 中列 · 波形图 ==== */
        /* [2026-08-08 UI优化] 参考竞品设计: 去掉左侧AM(rPPG波形)图表，
           BPM(心率趋势)图表拉长铺满整行，视觉上更突出、更接近竞品的
           单一大图表布局。整体行高由200px增加到260px，让图表更"高"、
           更醒目。旧的 .charts-box-half (双图对半布局) 已不再使用，
           改为 .charts-box-full (单图铺满整行)。 */
        .charts-row {
            display: flex; gap: 12px;
            height: 260px;
            flex-shrink: 0;
        }
        .charts-box-full {
            flex: 1; height: 100%;
            padding: 10px;
            box-sizing: border-box;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .charts-box-full img {
            width: 100%; height: 100%; max-height: 240px; object-fit: contain;
        }

        /* ==== 中列 · 头姿+注意力 二卡区 ====
           [2026-08-09 异常检测移到右列] 用户需求：把⑥异常检测模块移到右侧
           (跟④面部表情&AU面板同列)，中列只保留②头姿&视线、③注意力两卡，
           两卡 flex:1 等分中列宽度——去掉⑥之后每卡分到的宽度从原来的 1/3
           自动变成 1/2，天然实现"宽度增加+平均分布"，不需要额外指定固定宽度。
           ⑥异常检测的 HTML 已经搬到 .col-right 内（见下方 .of-anomaly 样式），
           这里的 .of-triple 容器和 .of-headgaze/.of-attention 选择器同步移除
           对 .of-anomaly 的引用。 */
        .of-triple {
            display: flex; gap: 12px;
            flex: 1;
            min-height: 260px;
        }
        .of-headgaze, .of-attention {
            flex: 1;
            padding: 12px;
            box-sizing: border-box;
        }
        /* 头姿 罗盘
           [2026-08-09 罗盘设计优化] 用户反馈原来的空心圆+十字线太简陋，
           要求做：①东南西北四向刻度 ②内圈分层(雷达感) ③中心点呼吸光效。
           实现方式：
           - 刻度：4个 .tick 小方块，绝对定位在圆环外侧四个方向（见下方
             .compass .tick 系列规则）。
           - 内圈：新增 .ring-inner，半径为外圈的一半，虚线描边，形成
             "内圈=正常范围，超出内圈=偏移较大"的雷达图层次感。
           - 呼吸光效：给 .dot 增加 ::before 伪元素，用 dotPulseRing 关键帧
             做由内向外扩散、逐渐透明的光圈动画，强化"实时追踪中"的视觉感。
           - 额外加了径向渐变背景，让圆心略亮、边缘略暗，比纯色平面更有
             立体感和科技感。 */
        /* [2026-08-09 等比放大] 用户反馈罗盘整体偏小，88px -> 112px（┣1.27倍），
           内圈/十字线/背景渐变都用百分比定义会自动等比放大，只需要手动同步
           放大四向刻度和中心点的绝对 px 值（见下方 .tick/.dot规则）。 */
        .compass {
            width: 112px; height: 112px;
            border: 1px solid rgba(155,255,251,0.35);
            border-radius: 50%;
            position: relative;
            margin: 8px auto 4px auto;
            background: radial-gradient(circle, rgba(0,247,255,0.10) 0%, rgba(0,247,255,0.02) 65%, transparent 100%);
        }
        .compass::before, .compass::after {
            content: ''; position: absolute;
            background: rgba(155,255,251,0.2);
        }
        .compass::before {
            left: 0; right: 0; top: 50%; height: 1px;
        }
        .compass::after {
            top: 0; bottom: 0; left: 50%; width: 1px;
        }
        /* 内圈分层：半径为外圈一半，虚线，营造雷达图层次感 */
        .compass .ring-inner {
            position: absolute;
            top: 50%; left: 50%;
            width: 50%; height: 50%;
            border: 1px dashed rgba(155,255,251,0.28);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        /* 东南西北四向刻度：贴在圆环外侧突出一小段 */
        .compass .tick {
            position: absolute;
            background: rgba(155,255,251,0.5);
            border-radius: 1px;
        }
        .compass .tick.n, .compass .tick.s {
            left: 50%; width: 3px; height: 8px;
            transform: translateX(-50%);
        }
        .compass .tick.n { top: -8px; }
        .compass .tick.s { bottom: -8px; }
        .compass .tick.e, .compass .tick.w {
            top: 50%; width: 8px; height: 3px;
            transform: translateY(-50%);
        }
        .compass .tick.e { right: -8px; }
        .compass .tick.w { left: -8px; }
        .compass .dot {
            position: absolute;
            width: 10px; height: 10px; border-radius: 50%;
            background: #00F7FF;
            box-shadow: 0 0 8px #00F7FF;
            /* [2026-08-09 卡涩修复] left/top 固定不再变化，圆点的实际偏移改由 JS
               直接写 transform: translate(...) 控制（见下方 renderOpenFace 内的
               el.gazeDot.style.transform 赋值）。之前 JS 是逐帧改 style.left/top，
               这两个是几何属性，每次视线角度变化都会触发浏览器重新计算布局，是
               "数据变化时卡涩"的又一个来源；transform 平移是合成层属性，不触发
               重排，逐帧更新会顺滑很多。 */
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            /* [2026-08-09 生硬感修复] 同 AU 横条，不再用 CSS transition。头姿/视线
               数据同样每 1.5s 才更新一次，之前"停顿 1.2s -> 0.3s 猛冲到新位置"的
               节奏正是用户反馈"头部视线过渡生硬且慢"的原因。改为下方
               smoothAnimLoop() 用 requestAnimationFrame 持续插值，圆点会像跟随
               鼠标一样连续平滑地移动，不再有"卡一下再冲"的感觉。 */
            will-change: transform;
        }
        /* 呼吸光效：从圆点中心向外扩散的光圈，循环渐隐 */
        .compass .dot::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            border-radius: 50%;
            border: 2px solid #00F7FF;
            transform: translate(-50%, -50%);
            animation: dotPulseRing 2s ease-out infinite;
            pointer-events: none;
        }
        @keyframes dotPulseRing {
            0%   { width: 10px; height: 10px; opacity: 0.8; border-width: 2px; }
            100% { width: 34px; height: 34px; opacity: 0;   border-width: 1px; }
        }
        /* [2026-08-09 字体/间距优化] 用户反馈②③面板底部指标行文字偏小、
           行间过密。②③共用这一条 .kv-row 规则，统一放大字号+加大行距，
           两个面板同步生效，视觉一致，不存在"③比②小"的真实差异。 */
        .kv-row {
            display: flex; justify-content: space-between;
            font-size: 13px; margin: 6px 0;
            color: #EBEBEB;
        }
        .kv-row .k { color: #9BFFFB; }
        .kv-row .v { font-weight: bold; }

        /* [2026-08-09 标签-数值间距优化，仅限②头姿&视线面板] 用户反馈②
           面板文字和数字之间的间距太远——原因是默认 .kv-row 用
           justify-content:space-between，会把标签、数值按整行容器宽度
           撑开；②面板变宽(1/2列)+罗盘/指标列左右并排布局后，右侧指标列
           (.hg-kv)本身较宽，space-between 被拉得很开。这里只覆盖
           .hg-kv 内部的 .kv-row（不影响③注意力面板共用的默认样式）：
           取消 space-between，改为标签固定宽度(64px，足够容纳最长的
           "60s 偏移"文案) + 数值紧跟其后只留 10px 小间距，标签和数值
           紧凑贴合，不再随容器宽度被拉远；副作用是各行数值会自然纵向
           对齐成一列，视觉上更整齐。 */
        .hg-kv .kv-row {
            justify-content: flex-start;
            align-items: baseline;
        }
        .hg-kv .kv-row .k { width: 64px; flex-shrink: 0; }
        .hg-kv .kv-row .v { margin-left: 10px; }

        /* [2026-08-09 布局优化] ②头姿&视线面板从中列 1/3 宽变为 1/2 宽后，
           罗盘右侧、Yaw/Pitch/Roll/60s偏移文字上方出现大片空白。改为
           "罗盘 + 指标列表"左右并排，把新增的横向空间利用起来，而不是
           继续上下堆叠、只在纵向拉长空白。
           [2026-08-09 右对齐优化] 用户反馈：标题"视线偏移·向左看"+
           Yaw/Pitch/Roll/60s偏移 这一整块要整体向右移动，实现右对齐，但需
           预留右边距。改法：.hg-kv 不再用 flex:1 均分剩余宽度，改为
           flex:0 0 auto + margin-left:auto，把自己推到 .hg-body 行内的
           最右侧；再给 .hg-kv 加 padding-right 预留与面板右边框的距离，
           避免贴边。罗盘位置不受影响，仍在 .hg-body 左侧。 */
        /* [2026-08-09 间距调整] 用户反馈整体内容离标题"头姿 & 视线"太近，
           把 margin-top 从 4px 加大到 18px，与面板标题拉开距离。 */
        .hg-body {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-top: 18px;
        }
        .hg-body .compass {
            margin: 0;
            flex-shrink: 0;
        }
        .hg-kv {
            flex: 0 0 auto;
            margin-left: auto;
            padding-right: 10px;
            box-sizing: border-box;
            min-width: 0;
        }
        /* 标题"视线偏移·向左看"：现在作为 .hg-kv 内的首行，与下方
           Yaw/Pitch/Roll 列表左对齐(不再居中)，作为整个右对齐块的标题 */
        .hg-gaze-state {
            font-size: 14px; font-weight: bold; color: #00E1A6;
            margin-bottom: 6px;
            white-space: nowrap;
        }

        /* 注意力大数字 */
        .att-score {
            text-align: center;
            font-size: 54px; font-weight: bold;
            color: #FFFFFF;
            font-family: 'Segoe UI', Consolas, monospace;
            line-height: 1;
            margin: 12px 0 4px 0;
        }
        .att-score .slash { font-size: 18px; color: #6C82A6; margin-left: 4px; }
        .att-sub { text-align: center; font-size: 12px; color: #B6BCC7; margin-bottom: 12px; }

        /* 异常列表
           [2026-08-09 间距优化] 用户反馈⑥异常检测面板最后一条(HRV)和底部
           蓝色建议条之间空白过大——⑥现在是 .col-right 的 last-child，会被
           `.col-right > *:last-child { flex:1; }` 拉伸到吃掉右列剩余高度，
           但面板内部原来是普通块级流，多出来的高度全部堆积在"建议条"前后，
           显得突兀。改法：.of-anomaly 自身转成纵向 flex 容器，.anomaly-list
           设 flex:1 并 justify-content:center，让 6 条指标在列表可用的
           弹性空间里居中分布、行间距自动撑开，而不是聚在顶部留出一块
           呆板的空白再接建议条；同时列表行 padding/字号也一并放大，
           提升可读性。 */
        .anomaly-level {
            display: flex; align-items: center;
            margin: 6px 0 10px 0;
        }
        .anomaly-level .indicator {
            width: 10px; height: 10px; border-radius: 50%;
            background: #FFD466;
            box-shadow: 0 0 6px #FFD466;
            margin-right: 8px;
        }
        .anomaly-level .txt {
            font-size: 18px; font-weight: bold; color: #FFFFFF;
        }
        .anomaly-list {
            display: flex;
            flex-direction: column;
            justify-content: center;
            flex: 1;
        }
        .anomaly-list .item {
            display: flex; justify-content: space-between;
            font-size: 13px; color: #EBEBEB;
            padding: 6px 0;
            border-bottom: 1px dashed rgba(155,255,251,0.15);
        }
        .anomaly-list .item .v { font-weight: bold; }
        .anomaly-list .item .v.warn { color: #FFD466; }
        .anomaly-list .item .v.ok { color: #00E1A6; }
        .anomaly-advice {
            margin-top: 10px;
            padding: 8px 10px;
            background: rgba(0, 247, 255, 0.08);
            border-left: 2px solid #00F7FF;
            font-size: 12px; color: #9BFFFB;
        }

        /* ==== 右列 · 头姿+眼动详情 (两卡上) ==== */
        .of-eye-detail {
            width: 100%;
            padding: 14px;
            display: flex; flex-direction: column;
            gap: 6px;
        }
        .eye-kv {
            display: flex; justify-content: space-between;
            font-size: 13px; padding: 4px 0;
        }
        .eye-kv .k { color: #9BFFFB; }
        .eye-kv .v { color: #FFFFFF; font-weight: bold; }

        /* ==== 右列 · 面部 AU ====
           [2026-08-09 高度压缩] 用户反馈：④面部表情&AU面板(红框区域)之前因为
           `.col-right > *:last-child { flex: 1; }` 被拉伸撑满整列剩余高度，
           而其真实内容(主导文字+6条AU横条+分割线+底部统计)远没有那么高，
           导致底部大片空白。改法：显式设置 height 等于中列"动态图"(心率趋势图
           .charts-row，高度260px)的高度，使这块面板的整体高度与左侧动态图
           对齐，而不是依赖内容自然高度凑巧接近；overflow:hidden 兜底避免内容
           变化时撑破。
           [2026-08-09 异常检测移到右列后的补充说明] ⑥异常检测搬入右列后，
           ④不再是 .col-right 的 last-child（⑥变成了新的 last-child），所以
           `*:last-child { flex:1 }` 已经不会再作用到④，这里不需要再单独覆盖，
           但仍保留显式 height:260px，确保不管 flex 规则如何变化，④的高度都
           稳定对齐动态图。 */
        .au-panel {
            width: 100%;
            height: 260px;
            padding: 14px;
            box-sizing: border-box;
            overflow: hidden;
        }
        .au-dominant {
            font-size: 15px; font-weight: bold; color: #FFFFFF;
            margin-bottom: 10px;
        }
        .au-row {
            display: flex; align-items: center;
            font-size: 12px; margin-bottom: 6px;
        }
        .au-row .label {
            width: 110px; color: #9BFFFB;
        }
        .au-row .bar-bg {
            flex: 1; height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
            margin-right: 8px;
        }
        .au-row .bar-fg {
            /* [2026-08-09 根本修复] .bar-fg 是 <span>，span 默认是 inline 元素，
               而 CSS 规范规定 inline 元素的 width 属性完全不生效（浏览器直接忽略），
               不管 JS 把 width 算成百分之几都不会画出来——这就是之前"填充条完全不动，
               哪怕数值是 0.78 也是空的"的真正原因，跟数值大小/缓存/动画都无关。
               这里显式声明 display: block 让 width 生效。 */
            display: block;
            height: 100%;
            /* [2026-08-09 卡涩修复-改用 transform 而不是 width 做伸缩]
               width 是"几何/布局属性"：每次数值变化、CSS transition 逐帧过渡时，
               浏览器都要重新计算整个页面的布局(reflow)，在数据频繁刷新(AU每1.5s、
               心率每2s)的场景下持续触发，就是用户反馈"数据变化时卡涩"的根因。
               改法：width 固定为 100%(不再变化)，真正的"长度"通过
               transform: scaleX(比例) 控制——transform 是合成层属性，浏览器可以
               直接交给 GPU 处理，不需要重新排版，逐帧过渡会顺滑很多。
               transform-origin 设为左侧，保证缩放是"从左边往右长"，视觉效果
               和之前改 width 完全一致。 */
            width: 100%;
            transform: scaleX(0);
            transform-origin: left center;
            background: linear-gradient(90deg, #00F7FF, #FFD466);
            border-radius: 3px;
            /* [2026-08-09 生硬感修复] 不再用 CSS transition 做过渡。原因：数据每
               1.5s 才从后端返回一次，之前"CSS transition + 数据到达时才赋值"的
               组合，视觉上是"横条僵住1.2秒不动 -> 数值到达瞬间用0.35s过渡一次"，
               这种"停顿-猛冲"的节奏正是用户反馈"过渡太快/生硬"的原因（参考实测
               录屏：横条在两次数据间完全静止，新数据到达时才有一次性变化）。
               改为下方 smoothAnimLoop() 用 requestAnimationFrame 以~60fps持续对
               目标值做插值(lerp)，横条会在每一帧里都"往目标值挪一点"，视觉上
               变成连续、匀速感更强的运动，不再需要 CSS transition 这层。 */
            will-change: transform;
        }
        /* [2026-08-09 AU横条脉冲动画] 每次收到新的AU数值且发生变化时，无论变化幅度
           多小，都会给横条临时加一次发光闪烁反馈，让用户能明确感知到"这一帧数据
           确实更新了"，而不是死数据——这是用户明确要求的效果。
           [2026-08-09 卡涩修复] 之前脉冲动画里还叠加了 transform: scaleX(1.06) 的
           拉伸弹跳，但 .bar-fg 本身已经用 transform: scaleX(比例) 表示数值长度，
           两处同时写 transform 会互相覆盖冲突(动画期间数值缩放会被强制归位再弹跳，
           效果既不对也不顺滑)。改为只做 box-shadow 发光 + filter 亮度闭烁，这两个
           都是"仅重绘(paint)、不重新排版"的轻量属性，和 transform 互不冲突，
           组合起来一样能清楚地"提示数据更新了"，且更顺滑。
           动画结束后 JS 会自动移除该 class，等待下一次数值变化再触发。 */
        .au-row .bar-fg.au-pulse {
            animation: auPulseKeyframes 0.5s ease-out;
        }
        @keyframes auPulseKeyframes {
            0%   { box-shadow: 0 0 0 rgba(0,247,255,0);   filter: brightness(1); }
            30%  { box-shadow: 0 0 8px rgba(0,247,255,0.9); filter: brightness(1.35); }
            100% { box-shadow: 0 0 0 rgba(0,247,255,0);   filter: brightness(1); }
        }
        .au-row .value {
            width: 34px; text-align: right;
            color: #EBEBEB;
        }
        .au-meta {
            font-size: 11px; color: #B6BCC7;
            margin-top: 6px;
            display: flex; justify-content: space-between;
        }

        /* ==== 右列 · 异常检测 (2026-08-09 从中列②③⑥三卡区搬到右列) ====
           原来 .of-anomaly 的宽度/padding/box-sizing 是靠中列共享选择器
           `.of-headgaze, .of-attention, .of-anomaly { flex:1; padding:12px;
           box-sizing:border-box; }` 提供的；现在搬到右列独立展示，需要单独
           补一份等价样式，并按右列(470px)宽度重新适配：
           - width:100% 让它跟同列的 .of-eye-detail/.au-panel 一样撑满右列宽度
             （而不是继续用中列窄卡的宽度）。
           - 作为 .col-right 新的 last-child，天然吃到 `.col-right > *:last-child
             { flex:1; }` 这条既有规则，自动填满右列剩余高度——效果上相当于
             把"填满剩余空间"的角色从④面部表情面板转移给了⑥异常检测，
             这样④可以保持上一步设定的 height:260px 与动态图对齐，⑥则负责
             吃掉剩下的高度，不会在右列底部再留出大片空白。 */
        .of-anomaly {
            width: 100%;
            padding: 14px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        /* 通用页面底部提示 */
        .footer-tip {
            position: absolute;
            bottom: 6px; left: 0; right: 0;
            text-align: center;
            font-size: 11px; color: #6C82A6;
        }
    </style>
    <!-- [2026-08-09 性能优化] 全站没有任何 <i class="fa..."> 图标真正使用 FontAwesome，
         之前却同步加载了这个国外 CDN 的 CSS 文件——实测从当前网络环境访问该 CDN
         耗时 8 秒以上，会直接阻塞/拖慢首屏渲染。确认为完全无用的死引用，直接删除。 -->
</head>

<div class="box">

    <!-- ============ 顶栏 ============ -->
    <div class="bg-top">
