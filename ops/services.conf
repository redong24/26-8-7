# =============================================================================
# 服务清单 —— svc 命令的唯一配置来源
# =============================================================================
# 改端口、换 conda 环境、加新服务，都只改这个文件，不用动 svc.sh。
#
# 每行一个服务，字段用 | 分隔（字段内不要出现 | ）：
#
#   1 name        服务短名，命令行里用它：svc restart openface
#   2 port        监听端口（停服/健康检查都靠它定位，必须准确）
#   3 workdir     启动时的工作目录（脚本会 cd 进去，相对 import 才不会崩）
#   4 kind        启动形态：gunicorn | python
#   5 python      解释器绝对路径（conda 环境的 bin/python，不用 activate）
#   6 cmd         启动参数（kind=python 时是脚本名；gunicorn 时是完整参数）
#   7 health      健康检查 URL，留 "-" 表示只查端口不查 HTTP
#   8 log         日志落点绝对路径
#
# ⚠️ 端口以「线上实际监听」为准，不是以文档为准。2026-08-21 核对：
#    - 音频服务实际跑在 5003（audio_service.py 里 AUDIO_SERVICE_PORT 默认 5003，
#      audio_client.py 也是连 5003）。此前口头说的 "5001" 并不存在，
#      写成 5001 会导致停不掉、也测不出健康 —— 已按实际值 5003 固化。
# =============================================================================

# --- 主应用：rPPG + 心理评估 Web（HTTPS / gunicorn） -------------------------
# 单 worker 是硬约束：会话存在进程内存里（rppg_app.sessions + 线程锁），
# 多 worker 会把同一用户的请求打到不同进程，会话直接丢。
